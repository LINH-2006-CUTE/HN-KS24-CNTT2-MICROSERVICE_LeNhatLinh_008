server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: organizer-service
          uri: lb://organizer-service
          predicates:
            - Path=/api/organizers/**
        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/api/events/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
